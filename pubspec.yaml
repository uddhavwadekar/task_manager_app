name: task_manager
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# YOU MUST ONLY HAVE ONE OF THESE
dependencies:
  flutter:
    sdk: flutter
  # UI and State
  cupertino_icons: ^1.0.8

  # Blank versions force Flutter to find the perfect compatible matrix
  firebase_core: 
  firebase_auth: 
  cloud_firestore: 
  
  http: ^1.2.0
  intl: ^0.19.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  # Added assets section so the app can see your icon and other images
  assets:
    - assets/images/

# THIS MUST BE FLUSH TO THE LEFT (No spaces before 'flutter_launcher_icons')
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"